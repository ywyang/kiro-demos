version: '3.8'

services:
  # Gost 代理服务
  gost:
    image: gogost/gost:latest
    container_name: gost-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"    # HTTP 代理端口
      - "8443:8443"    # HTTPS 代理端口
      - "18080:18080"  # API 端口（供 Web UI 连接）
    volumes:
      - ./gost.yaml:/etc/gost/gost.yaml:ro
      - ./certs:/etc/gost/certs:ro
      - ./data:/var/lib/gost
    command: -C /etc/gost/gost.yaml
    networks:
      - proxy-network

  # Gost UI - 官方 Web 管理界面
  gost-ui:
    image: gogost/gost-ui:latest
    container_name: gost-web-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - proxy-network
    depends_on:
      - gost

networks:
  proxy-network:
    driver: bridge
